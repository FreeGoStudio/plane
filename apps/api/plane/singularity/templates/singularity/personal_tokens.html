<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>个人访问令牌 · Plane</title>
<main style="max-width:640px;margin:64px auto;font:16px/1.8 sans-serif;padding:24px">
<h1>个人访问令牌</h1><p>当前账号：{{ request.user.email }}</p>
{% if token %}
<p>令牌仅显示这一次，请保存到你自己的 MCP 客户端配置中，不要放入聊天或工具参数。</p>
<textarea readonly aria-label="新建的个人访问令牌" style="width:100%">{{ token }}</textarea>
<p>有效期至 {{ expires }}。实际访问仍受当前项目权限限制。</p>
{% else %}
<form method="post">{% csrf_token %}
<fieldset><legend>允许的操作</legend>{% for scope in scopes %}
<label><input type="checkbox" name="scope" value="{{ scope }}">{{ scope }}</label><br>
{% endfor %}</fieldset>
<label>有效天数 <input type="number" name="days" value="30" min="1" max="90" required></label>
<p><button type="submit">创建个人令牌</button></p></form>
{% endif %}
<p><a href="/auth/singularity/connections/">查看或撤销我的授权</a></p></main></html>
